# Local infrastructure for TriageGraph. Run: docker compose up -d
# Owner: Member 4. Ask before changing.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: triagegraph
      POSTGRES_USER: ${DB_USER:-triagegraph}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-triagegraph}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-triagegraph} -d triagegraph"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"   # SMTP the backend sends to
      - "8025:8025"   # web inbox: http://localhost:8025

volumes:
  pgdata:
