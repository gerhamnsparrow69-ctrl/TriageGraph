# TriageGraph configuration.
# Rules (blueprint §22): each module owns one block under "app.<module>". Append new blocks at the
# end of the "app" section; never reorder or edit another member's block. Owner of this file: Member 4.

spring:
  application:
    name: triagegraph
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/triagegraph}
    username: ${DB_USER:triagegraph}
    password: ${DB_PASSWORD:triagegraph}
  jpa:
    open-in-view: false
    hibernate:
      # "update" until feature freeze (Sat 20:00). M4 then dumps db/schema.sql and switches to "validate".
      ddl-auto: update
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

server:
  port: 8080

management:
  health:
    # Mail is optional (notifications retry and degrade); a missing Mailpit must not mark the app DOWN.
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  # --- Member 4: security ---
  security:
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    jwt-ttl: 2h
    allowed-origins:
      - http://localhost:5173
  # --- Member 4: notifications ---
  notify:
    mail-from: triagegraph@localhost
    ntfy-base-url: ${NTFY_BASE_URL:https://ntfy.sh}
    email-enabled: true
    push-enabled: true
    retry-attempts: 3
    retry-backoff: 500ms
  # --- Member 2: triage (duplicate detection, classification, resolution suggestions) ---
  triage:
    embedder: minilm                  # minilm (in-process ONNX, falls back to lexical automatically) | lexical
    likely-duplicate-threshold: 0.62  # calibrated on triage/duplicate-pairs.tsv (F1 0.96); admins can change it
    possibly-related-threshold: 0.50
    duplicate-window: 72h
    repeat-window: 10m                # same reporter, near-identical text inside this window -> 409
    repeat-similarity: 0.95
    knn-neighbours: 5
    min-confidence: 0.60
    fallback-category: SOFTWARE
    llm:
      enabled: true                   # still off unless GEMINI_API_KEY is set
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-flash-lite-latest}
      base-url: https://generativelanguage.googleapis.com/v1beta
      timeout: 8s
      cache-size: 500
      failure-threshold: 3
      open-duration: 60s
  # --- Member 2: assignment ---
  assignment:
    default-strategy: SMART           # SMART | SKILL_BASED | LOAD_BALANCED | ROUND_ROBIN
    experience-cap: 5

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:triagegraph;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop

---
# Demo profile: same as dev, plus demo seed data and the SLA drill endpoint (enabled by each module).
spring:
  config:
    activate:
      on-profile: demo
